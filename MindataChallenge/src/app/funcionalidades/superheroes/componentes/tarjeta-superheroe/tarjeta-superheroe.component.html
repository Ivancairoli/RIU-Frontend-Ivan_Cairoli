<mat-card class="tarjeta-superheroe">
  <div class="imagen-superheroe">
    <img
      class="imagen-superheroe-archivo"
      [src]="superheroe().urlImagen"
      [alt]="'Imagen de ' + superheroe().nombre"
    />
  </div>

  <mat-card-header class="encabezado-tarjeta">
    <mat-card-title class="nombre-superheroe">{{ superheroe().nombre }}</mat-card-title>
  </mat-card-header>

  <mat-card-content class="contenido-tarjeta">
    <dl class="datos-superheroe">
      <div class="dato-superheroe">
        <dt class="dato-superheroe-etiqueta">Edad</dt>
        <dd class="dato-superheroe-valor">{{ superheroe().edad }} años</dd>
      </div>
      <div class="dato-superheroe">
        <dt class="dato-superheroe-etiqueta">Altura</dt>
        <dd class="dato-superheroe-valor">{{ superheroe().altura }} m</dd>
      </div>
    </dl>

    <p class="descripcion-superheroe">{{ superheroe().descripcion }}</p>
  </mat-card-content>

  <mat-card-actions class="acciones" align="end">
    <button class="boton-accion boton-editar" matButton type="button" (click)="abrirEdicion()">
      <mat-icon>edit</mat-icon>
      Editar
    </button>
    <button
      class="boton-accion boton-eliminar"
      matButton
      type="button"
      (click)="abrirConfirmacionEliminacion()"
    >
      <mat-icon class="icono-eliminar">delete</mat-icon>
      Eliminar
    </button>
  </mat-card-actions>
</mat-card>
