<mat-card class="tarjeta-superheroe">
  <div class="imagen-superheroe">
    @if (!imagenNoDisponible()) {
      <img [src]="superheroe().urlImagen" />
    } @else {
      <div class="imagen-pendiente">
        <mat-icon aria-hidden="true">person</mat-icon>
        <span>Imagen pendiente</span>
      </div>
    }
  </div>

  <mat-card-header>
    <mat-card-title>{{ superheroe().nombre }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <dl class="datos-superheroe">
      <div>
        <dt>Edad</dt>
        <dd>{{ superheroe().edad }} años</dd>
      </div>
      <div>
        <dt>Altura</dt>
        <dd>{{ superheroe().altura }} m</dd>
      </div>
    </dl>

    <p>{{ superheroe().descripcion }}</p>
  </mat-card-content>
</mat-card>
