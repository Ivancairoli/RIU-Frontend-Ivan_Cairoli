<h2 mat-dialog-title>Eliminar superhéroe</h2>

<mat-dialog-content>
  <p>¿Estás seguro de que querés eliminar a {{ superheroe.nombre }}?</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton [mat-dialog-close]="false">Cancelar</button>
  <button matButton="filled" [mat-dialog-close]="true">Eliminar</button>
</mat-dialog-actions>
