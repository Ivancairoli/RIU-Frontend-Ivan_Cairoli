<header class="titulo-lista-superheroes">
  <div class="encabezado-lista">
    <div>
      <h2 class="titulo-lista">Superhéroes</h2>
      <p class="descripcion-lista">{{ superheroes().length }} héroes disponibles</p>
    </div>
  </div>

  <div class="grilla-superheroes">
    @for (superheroe of superheroes(); track superheroe.id) {
      <app-tarjeta-superheroe [superheroe]="superheroe" />
    } @empty {
      <p class="lista-vacia">Todavía no hay superhéroes para mostrar.</p>
    }
  </div>
</header>
