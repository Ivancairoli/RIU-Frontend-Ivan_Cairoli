<header class="titulo-lista-superheroes">
  <div class="encabezado-lista">
    <div>
      <h2 class="titulo-lista">Superhéroes</h2>
      <p class="descripcion-lista">{{ superheroes().length }} héroes disponibles</p>
    </div>

    <button matButton="filled" type="button" (click)="abrirModalCreacion()">
      <mat-icon aria-hidden="true">add</mat-icon>
      Agregar superhéroe
    </button>
  </div>

  <mat-form-field class="filtro-superheroes" appearance="outline">
    <mat-label>Buscar por nombre</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input
      matInput
      type="search"
      [value]="filtroNombre()"
      (input)="actualizarFiltro($event)"
      placeholder="Ingrese un nombre de superheroe"
    />
    @if (filtroNombre()) {
      <button matIconButton matSuffix type="button" (click)="limpiarFiltro()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  <div class="grilla-superheroes">
    @for (superheroe of superheroesPaginados(); track superheroe.id) {
      <app-tarjeta-superheroe [superheroe]="superheroe" />
    } @empty {
      <p class="lista-vacia">No se encontraron superhéroes con ese nombre.</p>
    }
  </div>

  @if (superheroes().length > 0) {
    <mat-paginator
      [length]="superheroes().length"
      [pageIndex]="indicePagina()"
      [pageSize]="cantidadPorPagina()"
      [pageSizeOptions]="opcionesCantidad"
      showFirstLastButtons
      aria-label="Seleccionar página de superhéroes"
      (page)="cambiarPagina($event)"
      class="paginador-superheroes"
    />
  }
</header>
